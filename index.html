<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buscar pase</title>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#0b1220; color:#e5e7eb; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius: 14px; padding: 16px; }
    .muted { color:#9ca3af; font-size: 14px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; }
    input {
      flex:1; min-width:260px; padding:10px 12px; border-radius:10px;
      border:1px solid #334155; background:#0f172a; color:#e5e7eb; outline:none;
    }
    .btn { padding: 10px 12px; border-radius: 10px; border:1px solid #334155; background:#0f172a; color:#e5e7eb; cursor:pointer; }
    .btn:active { transform: translateY(1px); }
    .error { margin-top:12px; background:#2a0a0a; border:1px solid #7f1d1d; border-radius:12px; padding:12px; white-space:pre-wrap; display:none; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>🎟️ Buscar mi pase</h1>
      <div class="muted">
        Pega tu token para abrir tu pase.
      </div>

      <div class="row">
        <input id="tokenInput" placeholder="Token" autocomplete="off" autocapitalize="none" />
        <button class="btn" id="goBtn">Buscar</button>
      </div>

      <div id="errorBox" class="error"></div>

      <div class="muted" style="margin-top:12px;">
        ¿Dónde está mi token? Normalmente viene en tu correo o mensaje.
      </div>
    </div>
  </div>

  <script>
    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = msg;
    }
    function clearError() {
      const box = document.getElementById("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }

    function go() {
      clearError();
      const token = (document.getElementById("tokenInput").value || "").trim();
      if (!token) {
        showError("Pega un token para continuar.");
        return;
      }
      // Redirige a detalle
      location.href = `pase.html?token=${encodeURIComponent(token)}`;
    }

    document.getElementById("goBtn").onclick = go;
    document.getElementById("tokenInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") go();
    });
  </script>
</body>
</html>
