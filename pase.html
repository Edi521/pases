<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi pase</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111827" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#0b1220; color:#e5e7eb; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius: 14px; padding: 16px; }
    .row { display:flex; gap: 12px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 220px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .muted { color:#9ca3af; font-size: 14px; }
    .label { color:#9ca3af; font-size: 12px; margin-top: 10px; }
    .value { font-size: 16px; margin-top: 2px; word-break: break-word; }
    .badge { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; border:1px solid #334155; }
    .ok { background:#052e1a; border-color:#14532d; }
    .warn { background:#2a1d05; border-color:#78350f; }
    .bad { background:#2a0a0a; border-color:#7f1d1d; }
    .btn { padding: 10px 12px; border-radius: 10px; border:1px solid #334155; background:#0f172a; color:#e5e7eb; cursor:pointer; }
    .btn:active { transform: translateY(1px); }
    .qr { width: 220px; height: 220px; background:#fff; border-radius: 12px; display:flex; align-items:center; justify-content:center; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
    .error { background:#2a0a0a; border:1px solid #7f1d1d; border-radius:12px; padding:12px; display:none; margin-top:12px; }

    #installBanner { display:none; position:sticky; top:0; z-index:9999; background:#0f172a; border-bottom:1px solid #334155; }

    @media print {
      body { background:#fff; color:#000; }
      .topbar, #installBanner, .actions, .muted { display:none !important; }
    }

    .pdf-hide { display: none !important; }

  </style>
</head>

<body>

<div id="installBanner">
  <div style="max-width:720px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;">
    <div style="flex:1">
      <strong>📌 Obtener boleto</strong>
      <div class="muted">Agrega este boleto a tu pantalla principal.</div>
    </div>
    <button id="installBtn" class="btn">Agregar</button>
    <button id="installCloseBtn" class="btn">Cerrar</button>
  </div>
</div>

<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🎟️ Mi pase</h1>
      <div class="muted" id="subtitle">Cargando…</div>
    </div>
    <a class="btn" href="index.html">Buscar otro</a>
  </div>

  <div id="passCard" class="card" style="display:none;">
    <div class="row">
      <div class="col">
        <div class="label">Estado</div>
        <div class="value" id="status"></div>

        <div class="label">Nombre</div>
        <div class="value" id="nombre"></div>

        <div class="label">Asiento</div>
        <div class="value" id="asiento"></div>

        <div class="label">Evento</div>
        <div class="value" id="nombreEvento"></div>

        <div class="label">Lugar</div>
        <div class="value" id="lugarDescripcion"></div>

        <div class="label">Hora</div>
        <div class="value" id="hora"></div>
      </div>

      <div class="col">
        <div class="label">QR</div>
        <div class="qr"><div id="qrImg"></div></div>

        <div id="actionsBar" class="actions" style="margin-top:10px;display:flex;gap:10px;">
          <button class="btn" id="btnInstall">Obtener boleto</button>
          <button class="btn" id="btnPdf">Descargar PDF</button>
        </div>
      </div>
    </div>
  </div>

  <div id="errorBox" class="error"></div>
</div>

<!-- QR local (ligero, no bloquea) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // ========= CONFIG =========
  const API_BASE_URL = "https://script.google.com/macros/s/AKfycbxb7tNEfgSrmGHAYDYR76rJw3eS9XJ2XG2JaDppxiS1ls0j_iQJck5599wGbkBlvxezZg/exec";

  // ========= Service Worker =========
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  }

  // ========= Helpers =========
  const $ = (id) => document.getElementById(id);

  function showError(msg) {
    const box = $("errorBox");
    if (!box) return;
    box.style.display = "block";
    box.textContent = msg;
  }

  function clearError() {
    const box = $("errorBox");
    if (!box) return;
    box.style.display = "none";
    box.textContent = "";
  }

  function getTokenFromQuery() {
    return (new URL(location.href).searchParams.get("token") || "").trim();
  }

  function isIOS_() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent || "");
  }

  function isAndroid_() {
    return /Android/i.test(navigator.userAgent || "");
  }

  function isStandalone_() {
    return window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;
  }

  function setStatusBadge(status) {
    const el = $("status");
    if (!el) return;

    const s = (status || "").toUpperCase();
    let cls = "badge";
    let label = s;

    if (s === "ISSUED") { cls += " ok"; label = "VÁLIDO"; }
    else if (s === "USED") { cls += " warn"; label = "YA USADO"; }
    else { cls += " bad"; }

    el.innerHTML = `<span class="${cls}">${label}</span>`;
  }

  function setQr(link) {
    const container = $("qrImg");
    if (!container) return;
    container.innerHTML = "";

    if (typeof QRCode === "undefined") {
      setTimeout(() => setQr(link), 50);
      return;
    }

    new QRCode(container, {
      text: link,
      width: 200,
      height: 200,
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // ========= Install PWA =========
  let deferredInstallPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function wireInstallUI_() {
    const btnInstall = $("btnInstall");
    if (!btnInstall) return;

    btnInstall.onclick = async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        try { await deferredInstallPrompt.userChoice; } catch {}
        deferredInstallPrompt = null;
        return;
      }

      if (isIOS_()) {
        alert('En iPhone:\n1) Compartir\n2) Agregar a pantalla de inicio');
        return;
      }

      if (isAndroid_()) {
        alert('Menú ⋮ → Agregar a pantalla principal');
        return;
      }
    };
  }

  // ========= PDF =========
  function loadScriptOnce_(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("No se pudo cargar " + src));
      document.head.appendChild(s);
    });
  }

  async function downloadPdfFromPassCard_() {
    const btn = $("btnPdf");
    const card = $("passCard");
    const actions = document.querySelector(".actions");

    if (!card) {
      showError("No se encontró el pase.");
      return;
    }

    try {
      clearError();
      if (btn) { btn.disabled = true; btn.textContent = "Generando…"; }

      await loadScriptOnce_("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
      await loadScriptOnce_("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");

      // 🔹 OCULTAR BOTONES SOLO PARA EL PDF
      if (actions) actions.classList.add("pdf-hide");

      // Fondo oscuro consistente
      const prevBg = card.style.backgroundColor;
      const prevColor = card.style.color;
      card.style.backgroundColor = "#111827";
      card.style.color = "#e5e7eb";

      let canvas;
      try {
        canvas = await html2canvas(card, {
          scale: 2,
          backgroundColor: "#111827"
        });
      } finally {
        card.style.backgroundColor = prevBg;
        card.style.color = prevColor;
        if (actions) actions.classList.remove("pdf-hide"); // 🔹 RESTAURAR
      }

      const imgData = canvas.toDataURL("image/png");

      const { jsPDF } = window.jspdf;
      
      //Tamaño boleto en mm
      const anchoTiket = 90;
      const altoTiket = 55;

      //Margen interno
      const margen = 4;

      const pdf = new jsPDF({
        orientation: "landscape", //horizontal
        unit: "mm",
        format: [anchoTiket, altoTiket]
      });

    // Centrado exacto
    const x = (anchoTiket - imgW) / 2;
    const y = (altoTiket - imgH) / 2;

    // Área útil
    const usableW = anchoTiket - margen * 2;
    const usableH = altoTiket - margen * 2;

    //Para hacer el escalado proporcional
    const imgRatio = canvas.width / canvas.height;
    let imgW = usableW;
    let imgH = imgW / imgRatio;

    if (imgH > usableH) {
        imgH = usableH;
        imgW = imgH * imgRatio;
    }

    pdf.addImage(imgData, "PNG", x, y, imgW, imgH);

    const blob = pdf.output("blob");
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "pase.pdf"; //Nombre del archivo
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    } catch (err) {
      console.error(err);
      showError("No se pudo generar el PDF.");
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "Descargar PDF"; }
    }
  }

  function wirePdfButton_() {
    const btnPdf = $("btnPdf");
    if (!btnPdf) return;
    btnPdf.onclick = downloadPdfFromPassCard_;
  }

  // ========= Load Ticket =========
  async function loadTicket(token) {
    clearError();
    $("subtitle").textContent = "Buscando pase…";

    const res = await fetch(`${API_BASE_URL}?action=ticket&token=${encodeURIComponent(token)}`);
    const data = await res.json();

    if (!data.ok) {
      showError("Pase no encontrado");
      return;
    }

    const t = data.ticket;
    $("passCard").style.display = "block";
    $("subtitle").textContent = "Pase cargado";

    setStatusBadge(t.status);
    $("nombre").textContent = t.nombre || "-";
    $("asiento").textContent = t.asiento || "-";
    $("nombreEvento").textContent = t.nombreEvento || "-";
    $("lugarDescripcion").textContent = t.lugarDescripcion || "-";
    $("hora").textContent = t.hora || "-";

    const link = `${location.origin}${location.pathname}?token=${encodeURIComponent(token)}`;
    setQr(link);
  }

  // ========= INIT =========
  wireInstallUI_();
  wirePdfButton_();

  const token = getTokenFromQuery();
  if (!token) {
    showError("Falta token");
  } else {
    loadTicket(token);
  }
</script>



</body>
</html>
