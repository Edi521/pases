<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi pase</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111827" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#0b1220; color:#e5e7eb; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius: 14px; padding: 16px; }
    .row { display:flex; gap: 12px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 220px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .muted { color:#9ca3af; font-size: 14px; }
    .label { color:#9ca3af; font-size: 12px; margin-top: 10px; }
    .value { font-size: 16px; margin-top: 2px; word-break: break-word; }
    .badge { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; border:1px solid #334155; }
    .ok { background:#052e1a; border-color:#14532d; }
    .warn { background:#2a1d05; border-color:#78350f; }
    .bad { background:#2a0a0a; border-color:#7f1d1d; }
    .btn { padding: 10px 12px; border-radius: 10px; border:1px solid #334155; background:#0f172a; color:#e5e7eb; cursor:pointer; }
    .btn:active { transform: translateY(1px); }
    .qr { width: 220px; height: 220px; background:#fff; border-radius: 12px; display:flex; align-items:center; justify-content:center; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
    .error { background:#2a0a0a; border:1px solid #7f1d1d; border-radius:12px; padding:12px; display:none; margin-top:12px; }

    #installBanner { display:none; position:sticky; top:0; z-index:9999; background:#0f172a; border-bottom:1px solid #334155; }

    @media print {
      body { background:#fff; color:#000; }
      .topbar, #installBanner, .actions, .muted { display:none !important; }
    }
  </style>
</head>

<body>

<div id="installBanner">
  <div style="max-width:720px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;">
    <div style="flex:1">
      <strong>📌 Obtener boleto</strong>
      <div class="muted">Agrega este boleto a tu pantalla principal.</div>
    </div>
    <button id="installBtn" class="btn">Agregar</button>
    <button id="installCloseBtn" class="btn">Cerrar</button>
  </div>
</div>

<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🎟️ Mi pase</h1>
      <div class="muted" id="subtitle">Cargando…</div>
    </div>
    <a class="btn" href="index.html">Buscar otro</a>
  </div>

  <div id="passCard" class="card" style="display:none;">
    <div class="row">
      <div class="col">
        <div class="label">Estado</div>
        <div class="value" id="status"></div>

        <div class="label">Nombre</div>
        <div class="value" id="nombre"></div>

        <div class="label">Asiento</div>
        <div class="value" id="asiento"></div>

        <div class="label">Evento</div>
        <div class="value" id="nombreEvento"></div>

        <div class="label">Lugar</div>
        <div class="value" id="lugarDescripcion"></div>

        <div class="label">Hora</div>
        <div class="value" id="hora"></div>
      </div>

      <div class="col">
        <div class="label">QR</div>
        <div class="qr"><div id="qrImg"></div></div>

        <div class="actions" style="margin-top:10px;display:flex;gap:10px;">
          <button class="btn" id="btnInstall">Obtener boleto</button>
          <button class="btn" id="btnPdf">Descargar PDF</button>
        </div>
      </div>
    </div>
  </div>

  <div id="errorBox" class="error"></div>
</div>

<!-- QR local (ligero, no bloquea) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // ========= CONFIG =========
  const API_BASE_URL = "https://script.google.com/macros/s/AKfycbxb7tNEfgSrmGHAYDYR76rJw3eS9XJ2XG2JaDppxiS1ls0j_iQJck5599wGbkBlvxezZg/exec";

  // Service Worker (para que Android considere instalable)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("../servicio-worker.js").catch(() => {});
  }

  // ========= helpers =========
  const $ = (id) => document.getElementById(id);

  function showError(msg) {
    const box = $("errorBox");
    if (!box) return;
    box.style.display = "block";
    box.textContent = msg;
  }

  function clearError() {
    const box = $("errorBox");
    if (!box) return;
    box.style.display = "none";
    box.textContent = "";
  }

  function getTokenFromQuery() {
    const url = new URL(location.href);
    return (url.searchParams.get("token") || "").trim();
  }

  function isIOS_() {
    const ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  }

  function isAndroid_() {
    const ua = navigator.userAgent || "";
    return /Android/i.test(ua);
  }

  function isStandalone_() {
    return (window.navigator.standalone === true) ||
           window.matchMedia("(display-mode: standalone)").matches;
  }

  function setStatusBadge(status) {
    const el = $("status");
    if (!el) return;

    const s = (status || "").toUpperCase();

    let cls = "badge";
    let label = s || "DESCONOCIDO";

    if (s === "ISSUED") { cls += " ok"; label = "VÁLIDO"; }
    else if (s === "USED") { cls += " warn"; label = "YA USADO"; }
    else if (s === "CANCELED" || s === "EXPIRED") { cls += " bad"; label = s; }
    else { cls += " bad"; }

    el.innerHTML = `<span class="${cls}">${label}</span>`;
  }

  function setQr(link) {
    const container = $("qrImg");
    if (!container) return;
    container.innerHTML = "";

    // Espera a que la lib esté lista (por defer)
    if (typeof QRCode === "undefined") {
      // retry suave
      setTimeout(() => setQr(link), 50);
      return;
    }

    new QRCode(container, {
      text: link,
      width: 200,
      height: 200,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // ========= Install (Android prompt + fallbacks) =========
  let deferredInstallPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    // Importante: sin esto, Chrome muestra el prompt cuando quiere y tú no lo controlas
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    hideInstallBanner_();
  });

  function showInstallBanner_() {
    const banner = $("installBanner");
    if (!banner) return;
    if (isStandalone_()) return;
    banner.style.display = "block";
  }

  function hideInstallBanner_() {
    const banner = $("installBanner");
    if (!banner) return;
    banner.style.display = "none";
  }

  function wireInstallUI_() {
    const btnInstall = $("btnInstall");
    if (btnInstall) {
      btnInstall.onclick = async () => {
        // ANDROID (Chrome/Edge): abre el diálogo nativo si está disponible
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          try { await deferredInstallPrompt.userChoice; } catch {}
          deferredInstallPrompt = null;
          hideInstallBanner_();
          return;
        }

        // iOS: no se puede abrir prompt por código → instrucciones
        if (isIOS_()) {
          alert('En iPhone:\n1) Toca "Compartir" (cuadro con flecha)\n2) "Agregar a pantalla de inicio"');
          return;
        }

        // Android sin prompt (webview/heurística)
        if (isAndroid_()) {
          alert('En Android:\n1) Menú ⋮ del navegador\n2) "Agregar a pantalla principal" o "Instalar app"');
          return;
        }

        alert('Usa el menú del navegador para "Agregar a pantalla principal".');
      };
    }

    // Si mantienes banner, cablearlo (opcional)
    const close = $("installCloseBtn");
    if (close) close.onclick = hideInstallBanner_;

    const bannerInstallBtn = $("installBtn");
    if (bannerInstallBtn) {
      bannerInstallBtn.onclick = async () => {
        // Reutiliza la misma lógica del botón principal
        if (btnInstall) btnInstall.click();
      };
    }

    // En iOS puedes mostrar el banner por defecto (si lo quieres)
    if (isIOS_() && !isStandalone_()) {
      showInstallBanner_();
    }
  }

  // ========= PDF (lazy load + centrado) =========
  function loadScriptOnce_(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Failed to load: " + src));
      document.head.appendChild(s);
    });
  }

  async function downloadPdfFromPassCard_() {
    const card = document.getElementById("passCard");

// Guarda estilos inline actuales
const prevBg = card.style.backgroundColor;
const prevColor = card.style.color;

// Fuerza el tema oscuro (igual que tu UI)
card.style.backgroundColor = "#111827";
card.style.color = "#e5e7eb";

try {
  const canvas = await html2canvas(card, {
    scale: 2,
    backgroundColor: "#111827" // IMPORTANTÍSIMO: fondo del canvas
  });

  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();

  const imgW = pageW * 0.90;
  const imgH = (canvas.height * imgW) / canvas.width;

  const x = (pageW - imgW) / 2;
  const y = (pageH - imgH) / 2;

  pdf.addImage(imgData, "PNG", x, y, imgW, imgH);
  pdf.save("pase.pdf");
} finally {
  // Restaura
  card.style.backgroundColor = prevBg;
  card.style.color = prevColor;
}

    }

  function wirePdfButton_() {
    const btnPdf = $("btnPdf");
    if (!btnPdf) return;
    btnPdf.onclick = () => downloadPdfFromPassCard_();
  }

  // ========= Load ticket =========
  async function loadTicket(token) {
    clearError();

    const subtitle = $("subtitle");
    if (subtitle) subtitle.textContent = "Buscando pase…";

    if (!API_BASE_URL.includes("/exec")) {
      showError("Configura API_BASE_URL con tu URL de Apps Script /exec.");
      if (subtitle) subtitle.textContent = "Error";
      return;
    }

    let res;
    try {
      res = await fetch(`${API_BASE_URL}?action=ticket&token=${encodeURIComponent(token)}`, { method: "GET" });
    } catch (e) {
      showError("No se pudo conectar al servidor. Revisa tu internet.");
      if (subtitle) subtitle.textContent = "Error";
      return;
    }

    let data;
    try {
      data = await res.json();
    } catch {
      showError("Respuesta inválida del servidor (no es JSON).");
      if (subtitle) subtitle.textContent = "Error";
      return;
    }

    if (!data.ok) {
      showError(`No se pudo cargar el pase: ${data.error || "ERROR"}`);
      if (subtitle) subtitle.textContent = "No encontrado";
      return;
    }

    const t = data.ticket;

    const card = $("passCard");
    if (card) card.style.display = "block";
    if (subtitle) subtitle.textContent = "Pase cargado";

    setStatusBadge(t.status);
    if ($("nombre")) $("nombre").textContent = t.nombre || "-";
    if ($("asiento")) $("asiento").textContent = t.asiento || "-";
    if ($("nombreEvento")) $("nombreEvento").textContent = t.nombreEvento || "-";
    if ($("lugarDescripcion")) $("lugarDescripcion").textContent = t.lugarDescripcion || "-";
    if ($("hora")) $("hora").textContent = (t.hora && String(t.hora).trim().length > 0) ? t.hora : "-";

    // El QR apunta al detalle del pase
    const passLink = `${location.origin}${location.pathname}?token=${encodeURIComponent(token)}`;
    setQr(passLink);
  }

  // ========= init =========
  wireInstallUI_();
  wirePdfButton_();

  const token = getTokenFromQuery();
  if (!token) {
    const subtitle = $("subtitle");
    if (subtitle) subtitle.textContent = "Falta token";
    showError("No se proporcionó token. Regresa a 'Buscar pase' y pega tu token.");
  } else {
    loadTicket(token);
  }
</script>


</body>
</html>
