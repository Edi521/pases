<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi pase</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111827" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#0b1220; color:#e5e7eb; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }

    h1 { font-size: 20px; margin: 0 0 8px; }
    .muted { color:#9ca3af; font-size: 14px; }

    .label { 
        color:#9ca3af; 
        font-size: 12px; 
        margin-top: 10px; 
    }
    .value { 
        font-size: 16px; 
        /*margin-top: 2px; */
        word-break: break-word; 
    }

    .badge { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; border:1px solid #334155; }
    .ok { background:#052e1a; border-color:#14532d; }
    .warn { background:#2a1d05; border-color:#78350f; }
    .bad { background:#2a0a0a; border-color:#7f1d1d; }

    .btn {
      padding: 10px 12px;
      border-radius: 12px;
      border:1px solid #334155;
      background:#0f172a;
      color:#e5e7eb;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      user-select: none;
    }
    .btn:active { transform: translateY(1px); }

    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; gap: 10px; }

    .error {
      background:#2a0a0a;
      border:1px solid #7f1d1d;
      border-radius:12px;
      padding:12px;
      display:none;
      margin-top:12px;
      white-space: pre-wrap;
    }

    /* Banner instalación */
    #installBanner {
      display:none;
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    /* Ocultar cosas solo al exportar PDF */
    .pdf-hide { display:none !important; }

    /* ====== TICKET LAYOUT CONSISTENTE ====== */
    #passCard {
      width: min(700px, 94vw);
      aspect-ratio: auto;    /* ticket */
      height: auto;
      overflow: hidden;         /* el ticket NO crece (por eso botones van fuera) */

      background:#111827;
      border:1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
      box-sizing: border-box;

      display: none;            /* se muestra al cargar ticket */
      margin: 0 auto;
    }

    .row { 
        display:flex;
        height: auto; 
        gap: 14px; height: 100%; 
        align-items: flex-start; 
        flex-wrap: nowrap; 
    }
    .col { min-width: 0; }

    /* Izquierda: info */
    .col-info { flex: 1 1 auto; min-width: 0; }

    /* Derecha: QR fijo */
    .col-qr { flex: 0 0 240px; min-width: 240px; display:flex; flex-direction: column; }

    .qr {
      width: 100%;
      aspect-ratio: 1 / 1;
      background:#fff;
      border-radius: 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px;
      box-sizing: border-box;
    }

    #qrImg img, #qrImg canvas {
      width: 100% !important;
      height: 100% !important;
      display:block;
    }

    /* Ajustes tipográficos dentro del ticket */
    #passCard .label { margin-top: 8px; }
    #passCard .value { font-size: 15px; }

    /* ===== Barra de acciones FUERA del ticket (no se recorta) ===== */
    #actionsBar{
      width: min(700px, 94vw);
      margin: 12px auto 0;
      display: none;                  /* se muestra al cargar ticket */
      grid-template-columns: 1fr 1fr; /* 2 botones iguales */
      gap: 10px;
    }

    #actionsBar .btn{
      width: 100%;
      height: 44px;
      font-weight: 700;
    }

    #btnInstall{
      background: #2563eb;
      border-color: #1d4ed8;
    }

    #btnPdf{
      background: #0f172a;
      border-color: #334155;
    }

    /* ===============================
   3 MEDIA QUERIES: grande / mediana / pequeña
   =============================== */

/* ---------- PANTALLAS GRANDES ---------- */
@media (min-width: 1024px) {
  /* Ticket más cómodo en desktop */
  #passCard {
    width: min(760px, 92vw);
    padding: 18px;
  }

  /* QR grande */
  .col-qr { flex: 0 0 260px; min-width: 260px; }
  .qr { padding: 12px; border-radius: 14px; }

  /* Tipografía */
  #passCard .value { font-size: 15px; line-height: 1.35; }
  #passCard .label { font-size: 12px; margin-top: 8px; }

  /* Botones */
  #actionsBar { width: min(760px, 92vw); }
}

    /* ---------- PANTALLAS MEDIANAS ---------- */
    @media (min-width: 600px) and (max-width: 1023px) {
    #passCard {
        width: min(700px, 94vw);
        padding: 16px;
    }

    .col-qr { flex: 0 0 220px; min-width: 220px; }
    .qr { padding: 10px; border-radius: 14px; }

    #passCard .value { font-size: 14px; line-height: 1.4; }
    #passCard .label { font-size: 12px; margin-top: 8px; }

    #actionsBar { width: min(700px, 94vw); }
    }

    /* ---------- PANTALLAS PEQUEÑAS ---------- */
    @media (max-width: 599px) {
    /* En móvil, el ticket se hace más compacto */
    #passCard {
    width: 94vw;
    padding: 14px;
    padding-bottom: 26px;   /* ✅ más espacio para la hora */
    aspect-ratio: auto;     /* ✅ deja crecer el alto */
    overflow: visible;      /* ✅ no recorta */
    min-height: 330px;      /* ✅ garantiza espacio (ajustable) */
    }

    /* QR más chico para dejar espacio a la hora */
    .col-qr { flex: 0 0 160px; min-width: 160px; }
    .qr { padding: 8px; border-radius: 12px; }

    /* Tipografía más pequeña + line-height para que NO se corte la hora */
    #passCard .value { font-size: 13px; line-height: 1.45; }
    #passCard .label { font-size: 11px; margin-top: 7px; }

    /* Botones apilados en móvil */
    #actionsBar { width: 94vw; grid-template-columns: 1fr; }
    }

  </style>
</head>

<body>

  <div id="installBanner">
    <div style="max-width:980px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div style="flex:1; min-width:220px;">
        <strong>📌 Obtener boleto</strong>
        <div class="muted">Agrega este boleto a tu pantalla principal.</div>
      </div>
      <button id="installBtn" class="btn">Agregar</button>
      <button id="installCloseBtn" class="btn" style="opacity:.85;">Cerrar</button>
    </div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>🎟️ Mi pase</h1>
        <div class="muted" id="subtitle">Cargando…</div>
      </div>
      <a class="btn" href="index.html">Buscar otro</a>
    </div>

    <!-- TICKET -->
    <div id="passCard">
      <div class="row">
        <div class="col col-info">
          <div class="label">Estado</div>
          <div class="value" id="status"></div>

          <div class="label">Nombre</div>
          <div class="value" id="nombre"></div>

          <div class="label">Asiento</div>
          <div class="value" id="asiento"></div>

          <div class="label">Evento</div>
          <div class="value" id="nombreEvento"></div>

          <div class="label">Lugar</div>
          <div class="value" id="lugarDescripcion"></div>

          <div class="label">Fecha y hora</div>
          <div class="value" id="hora"></div>
        </div>

        <div class="col col-qr">
          <div class="label">QR</div>
          <div class="qr">
            <div id="qrImg" style="width:100%; height:100%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTONES (FUERA DEL TICKET) -->
    <div id="actionsBar" class="actions">
      <button class="btn" id="btnInstall">Obtener boleto</button>
      <button class="btn" id="btnPdf">Descargar PDF</button>
    </div>

    <div id="errorBox" class="error"></div>
  </div>

  <!-- QR local -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    // ========= CONFIG =========
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbxb7tNEfgSrmGHAYDYR76rJw3eS9XJ2XG2JaDppxiS1ls0j_iQJck5599wGbkBlvxezZg/exec";

    // ========= Service Worker =========
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }

    // ========= Helpers =========
    const $ = (id) => document.getElementById(id);

    function showError(msg) {
      const box = $("errorBox");
      if (!box) return;
      box.style.display = "block";
      box.textContent = msg;
    }

    function clearError() {
      const box = $("errorBox");
      if (!box) return;
      box.style.display = "none";
      box.textContent = "";
    }

    function getTokenFromQuery() {
      return (new URL(location.href).searchParams.get("token") || "").trim();
    }

    function isIOS_() {
      const ua = navigator.userAgent || "";
      return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    }

    function isAndroid_() {
      return /Android/i.test(navigator.userAgent || "");
    }

    function isStandalone_() {
      return (window.navigator.standalone === true) ||
        window.matchMedia("(display-mode: standalone)").matches;
    }

    function setStatusBadge(status) {
      const el = $("status");
      if (!el) return;

      const s = (status || "").toUpperCase();
      let cls = "badge";
      let label = s || "DESCONOCIDO";

      if (s === "ISSUED") { cls += " ok"; label = "VÁLIDO"; }
      else if (s === "USED") { cls += " warn"; label = "YA USADO"; }
      else if (s === "CANCELED" || s === "EXPIRED") { cls += " bad"; label = s; }
      else { cls += " bad"; }

      el.innerHTML = `<span class="${cls}">${label}</span>`;
    }

    function setQr(link) {
      const container = $("qrImg");
      if (!container) return;
      container.innerHTML = "";

      if (typeof QRCode === "undefined") {
        setTimeout(() => setQr(link), 50);
        return;
      }

      new QRCode(container, {
        text: link,
        width: 260,
        height: 260,
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    // ========= Install PWA =========
    let deferredInstallPrompt = null;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      hideInstallBanner_();
    });

    function showInstallBanner_() {
      const banner = $("installBanner");
      if (!banner) return;
      if (isStandalone_()) return;
      banner.style.display = "block";
    }

    function hideInstallBanner_() {
      const banner = $("installBanner");
      if (!banner) return;
      banner.style.display = "none";
    }

    function wireInstallUI_() {
      const btnInstall = $("btnInstall");
      if (btnInstall) {
        btnInstall.onclick = async () => {
          if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            try { await deferredInstallPrompt.userChoice; } catch {}
            deferredInstallPrompt = null;
            hideInstallBanner_();
            return;
          }

          if (isIOS_()) {
            alert('En iPhone:\n1) Toca "Compartir"\n2) "Agregar a pantalla de inicio"');
            return;
          }

          if (isAndroid_()) {
            alert('En Android:\nMenú ⋮ → "Agregar a pantalla principal" o "Instalar app"');
            return;
          }

          alert('Usa el menú del navegador para agregar a pantalla principal.');
        };
      }

      const close = $("installCloseBtn");
      if (close) close.onclick = hideInstallBanner_;

      const bannerInstallBtn = $("installBtn");
      if (bannerInstallBtn) {
        bannerInstallBtn.onclick = () => {
          if (btnInstall) btnInstall.click();
        };
      }

      if (isIOS_() && !isStandalone_()) showInstallBanner_();
    }

    // ========= PDF =========
    function loadScriptOnce_(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error("No se pudo cargar: " + src));
        document.head.appendChild(s);
      });
    }

    async function downloadPdfFromPassCard_() {
      const btn = $("btnPdf");
      const card = $("passCard");
      const actionsBar = $("actionsBar");

      try {
        clearError();
        if (btn) { btn.disabled = true; btn.textContent = "Generando…"; }
        if (!card) throw new Error("No se encontró #passCard.");

        await loadScriptOnce_("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
        await loadScriptOnce_("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");

        const jsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDF) throw new Error("jsPDF no disponible (window.jspdf.jsPDF).");
        if (typeof html2canvas === "undefined") throw new Error("html2canvas no disponible.");

        // Ocultar botones (fuera del ticket) durante captura
        if (actionsBar) actionsBar.classList.add("pdf-hide");

        // Forzar colores para captura (evita fondo blanco)
        const prevBg = card.style.backgroundColor;
        const prevColor = card.style.color;
        card.style.backgroundColor = "#111827";
        card.style.color = "#e5e7eb";

        let canvas;
        try {
          canvas = await html2canvas(card, { scale: 3, backgroundColor: "#111827" });
        } finally {
          card.style.backgroundColor = prevBg;
          card.style.color = prevColor;
          if (actionsBar) actionsBar.classList.remove("pdf-hide");
        }

        const imgData = canvas.toDataURL("image/png");

        // ✅ PDF A4, ticket grande y centrado (se ve bien en cualquier visor)
        const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        // Márgenes “visuales” en la hoja
        const maxW = pageW * 0.92;
        const maxH = pageH * 0.85;

        // Proporción del pase
        const ratio = canvas.width / canvas.height;

        // Primero probamos por altura, luego verificamos ancho
        let drawH = maxH;
        let drawW = ratio * drawH;

        // Si por altura se pasa de ancho, ajustamos por ancho
        if (drawW > maxW) {
        drawW = maxW;
        drawH = drawW / ratio;
        }

        // Centrado exacto
        const x = (pageW - drawW) / 2;
        const y = (pageH - drawH) / 2;

        pdf.addImage(imgData, "PNG", x, y, drawW, drawH);

        // Descargar (Blob)
        const blob = pdf.output("blob");
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pase.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);

      } catch (err) {
        console.error(err);
        showError("PDF ERROR: " + (err?.message || String(err)));
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = "Descargar PDF"; }
      }
    }

    function wirePdfButton_() {
      const btnPdf = $("btnPdf");
      if (!btnPdf) return;
      btnPdf.onclick = () => downloadPdfFromPassCard_();
    }

    // ========= Load Ticket =========
    async function loadTicket(token) {
      clearError();
      const subtitle = $("subtitle");
      if (subtitle) subtitle.textContent = "Buscando pase…";

      let res;
      try {
        res = await fetch(`${API_BASE_URL}?action=ticket&token=${encodeURIComponent(token)}`);
      } catch (e) {
        showError("No se pudo conectar al servidor.");
        if (subtitle) subtitle.textContent = "Error";
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch {
        showError("Respuesta inválida del servidor.");
        if (subtitle) subtitle.textContent = "Error";
        return;
      }

      if (!data.ok) {
        showError("Pase no encontrado.");
        if (subtitle) subtitle.textContent = "No encontrado";
        return;
      }

      const t = data.ticket;

      // Mostrar ticket + acciones
      const passCard = $("passCard");
      const actionsBar = $("actionsBar");
      if (passCard) passCard.style.display = "block";
      if (actionsBar) actionsBar.style.display = "grid";
      if (subtitle) subtitle.textContent = "Pase cargado";

      setStatusBadge(t.status);
      $("nombre").textContent = t.nombre || "-";
      $("asiento").textContent = t.asiento || "-";
      $("nombreEvento").textContent = t.nombreEvento || "-";
      $("lugarDescripcion").textContent = t.lugarDescripcion || "-";

      // Formato de hora (si viene en ISO)
      const raw = t.hora || "-";
      let horaTxt = raw;
      const d = new Date(raw);
      if (raw !== "-" && !isNaN(d.getTime())) horaTxt = d.toLocaleString();
      $("hora").textContent = horaTxt;

      const link = `${location.origin}${location.pathname}?token=${encodeURIComponent(token)}`;
      setQr(link);
    }

    // ========= INIT =========
    wireInstallUI_();
    wirePdfButton_();

    const token = getTokenFromQuery();
    if (!token) {
      showError("Falta token. Regresa y pega tu token.");
      const subtitle = $("subtitle");
      if (subtitle) subtitle.textContent = "Falta token";
    } else {
      loadTicket(token);
    }
  </script>
</body>
</html>
