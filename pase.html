<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi pase</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Boletos">

  <!-- Favicons -->
  <link rel="icon" href="/pases/icons/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/pases/icons/icon.png">

  <style>
    /* ===============================
      BASE (MÓVIL Y TABLET POR DEFECTO)
      =============================== */

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #0b1220;
      color: #e5e7eb;
    }

    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }

    h1 { font-size: 20px; margin: 0 0 8px; }
    .muted { color:#9ca3af; font-size: 14px; }

    .label { color:#9ca3af; font-size: 15px; margin-top: 8px; }
    .value { font-size: 14px; margin-top: 2px; line-height: 1.45; word-break: break-word; }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid #334155;
    }
    .ok { background: #052e1a; border-color: #14532d; }
    .warn { background: #2a1d05; border-color: #78350f; }
    .bad { background: #2a0a0a; border-color: #7f1d1d; }

    /* Botones */
    .btn {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e5e7eb;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      user-select: none;
    }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: .7; cursor: not-allowed; }

    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .error {
      background:#2a0a0a;
      border:1px solid #7f1d1d;
      border-radius:12px;
      padding:12px;
      display:none;
      margin-top:12px;
      white-space: pre-wrap;
    }

    /* Banner instalación */
    #installBanner {
      display:none;
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    /* Ocultar cosas solo al exportar PDF */
    .pdf-hide { display:none !important; }

    /* ===============================
      TICKET (MÓVIL / TABLET)
      =============================== */

    #passCard {
      width: 94vw;
      max-width: 700px;

      /* SIN ALTURA FIJA */
      aspect-ratio: auto;
      height: auto;
      overflow: visible;

      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px 20px 34px 20px;
      box-sizing: border-box;

      margin: 0 auto;
      display: none;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
    }

    .col-info { flex: 1 1 auto; }

    .col-qr {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .col-qr .label { text-align: center; margin-bottom: 8px; }

    .qr {
      width: min(280px, 90vw);
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      padding: 10px;
      background: #ffffff;
      box-sizing: border-box;
    }

    #qrImg { width: 100%; height: 100%; }

    #qrImg img,
    #qrImg canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Acciones (fuera del ticket) */
    #actionsBar {
      width: 94vw;
      max-width: 700px;
      margin: 12px auto 0;
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    #btnInstall { background: #2563eb; border-color: #1d4ed8; }
    #btnPdf { background: #0f172a; border-color: #334155; }

    /* ===============================
      SOLO PC / DESKTOP (RIGIDEZ)
      =============================== */
    @media (min-width: 1024px) {
      #passCard {
        width: min(760px, 92vw);
        aspect-ratio: 90 / 55;
        overflow: hidden;
        padding: 20px 24px;
      }

      .row { flex-direction: row; align-items: center; }

      .col-info { flex: 1 1 auto; transform: translateY(6px); }

      .col-qr {
        flex: 0 0 300px;
        min-width: 300px;
        transform: translateY(6px);
      }

      .qr {
        width: 100%;
        max-width: 270px;
        padding: 10px;
        border-radius: 18px;
      }

      .value { font-size: 15px; line-height: 1.35; }

      #actionsBar {
        width: min(760px, 92vw);
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Banner instalación -->
  <div id="installBanner">
    <div style="max-width:980px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div style="flex:1; min-width:220px;">
        <strong>📌 Obtener boleto</strong>
        <div class="muted">Agrega este boleto a tu pantalla principal.</div>
      </div>
      <button id="installBtn" class="btn">Agregar</button>
      <button id="installCloseBtn" class="btn" style="opacity:.85;">Cerrar</button>
    </div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>🎟️ Mi pase</h1>
        <div class="muted" id="subtitle">Cargando…</div>
      </div>
      <a class="btn" href="index.html" id="backBtn">Buscar otro</a>
    </div>

    <!-- TICKET -->
    <div id="passCard">
      <div class="row">
        <div class="col col-info">
          <div class="label">Estado</div>
          <div class="value" id="status"></div>

          <div class="label">Nombre</div>
          <div class="value" id="nombre"></div>

          <div class="label">Asiento</div>
          <div class="value" id="asiento"></div>

          <div class="label">Evento</div>
          <div class="value" id="nombreEvento"></div>

          <div class="label">Lugar</div>
          <div class="value" id="lugarDescripcion"></div>

          <div class="label">Fecha y hora</div>
          <div class="value" id="hora"></div>
        </div>

        <div class="col col-qr">
          <div class="label">QR</div>
          <div class="qr">
            <div id="qrImg"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTONES (FUERA DEL TICKET) -->
    <div id="actionsBar" class="actions">
      <button class="btn" id="btnInstall">Obtener boleto</button>
      <button class="btn" id="btnPdf">Descargar PDF</button>
    </div>

    <div id="errorBox" class="error"></div>
  </div>

  <!-- QR local -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    // ========= CONFIG =========
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbxb7tNEfgSrmGHAYDYR76rJw3eS9XJ2XG2JaDppxiS1ls0j_iQJck5599wGbkBlvxezZg/exec";
    const LS_LAST_TOKEN_KEY = "lastTicketToken";

    // ========= Service Worker =========
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/pases/servicio-worker.js", { scope: "/pases/" })
        .catch(console.error);
    }

    // ========= Helpers =========
    const $ = (id) => document.getElementById(id);

    // Botón "Buscar otro" borra token recordado
    $("backBtn")?.addEventListener("click", () => {
      localStorage.removeItem(LS_LAST_TOKEN_KEY);
    });

    function showError(msg) {
      const box = $("errorBox");
      if (!box) return;
      box.style.display = "block";
      box.textContent = msg;
    }

    function clearError() {
      const box = $("errorBox");
      if (!box) return;
      box.style.display = "none";
      box.textContent = "";
    }

    function getTokenFromQuery() {
      return (new URL(location.href).searchParams.get("token") || "").trim();
    }

    function isIOS_() {
      const ua = navigator.userAgent || "";
      return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    }

    function isAndroid_() {
      return /Android/i.test(navigator.userAgent || "");
    }

    function isStandalone_() {
      return (window.navigator.standalone === true) ||
        window.matchMedia("(display-mode: standalone)").matches;
    }

    function setStatusBadge(status) {
      const el = $("status");
      if (!el) return;

      const s = (status || "").toUpperCase();
      let cls = "badge";
      let label = s || "DESCONOCIDO";

      if (s === "ISSUED") { cls += " ok"; label = "VÁLIDO"; }
      else if (s === "USED") { cls += " warn"; label = "YA USADO"; }
      else if (s === "CANCELED" || s === "EXPIRED") { cls += " bad"; label = s; }
      else { cls += " bad"; }

      el.innerHTML = `<span class="${cls}">${label}</span>`;
    }

    // Formateo fecha/hora
    function formatDateOnly_(v) {
  if (!v) return "";

  // Fecha válida de Sheets
  if (v instanceof Date && !isNaN(v.getTime())) {
    const dd = String(v.getDate()).padStart(2, "0");
    const mm = String(v.getMonth() + 1).padStart(2, "0");
    const yyyy = v.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  return String(v).trim();
}

function formatTime_(v) {
  if (!v) return "";

  // Hora viene como Date (Sheets)
  if (v instanceof Date && !isNaN(v.getTime())) {
    const hh = String(v.getHours()).padStart(2, "0");
    const mm = String(v.getMinutes()).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  // Hora como string ("17:00")
  const s = String(v).trim();
  if (/^\d{1,2}:\d{2}$/.test(s)) {
    const [h, m] = s.split(":");
    return `${String(h).padStart(2, "0")}:${m}`;
  }

  return s;
}

    }
  }

  if (!fechaTxt && !horaTxt) return "-";
  if (fechaTxt && horaTxt) return `${fechaTxt} ${horaTxt} hr`;
  return fechaTxt || `${horaTxt} hr`;
}*/


    // QR robusto (evita cuadro blanco)
    function setQr(link) {
      const container = $("qrImg");
      if (!container) return;

      container.innerHTML = "";

      if (typeof QRCode === "undefined") {
        setTimeout(() => setQr(link), 50);
        return;
      }

      requestAnimationFrame(() => {
        container.innerHTML = "";
        const size = Math.max(200, Math.min(320, container.clientWidth || 240));
        new QRCode(container, {
          text: link,
          width: size,
          height: size,
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    // ========= Install PWA =========
    let deferredInstallPrompt = null;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      hideInstallBanner_();
    });

    function showInstallBanner_() {
      const banner = $("installBanner");
      if (!banner) return;
      if (isStandalone_()) return;
      banner.style.display = "block";
    }

    function hideInstallBanner_() {
      const banner = $("installBanner");
      if (!banner) return;
      banner.style.display = "none";
    }

    function wireInstallUI_() {
      const btnInstall = $("btnInstall");
      const bannerInstallBtn = $("installBtn");
      const close = $("installCloseBtn");

      const installAction = async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          try { await deferredInstallPrompt.userChoice; } catch {}
          deferredInstallPrompt = null;
          hideInstallBanner_();
          return;
        }

        if (isIOS_()) {
          alert('En iPhone:\n1) Toca "Compartir"\n2) "Agregar a pantalla de inicio"');
          return;
        }

        if (isAndroid_()) {
          alert('En Android:\nMenú ⋮ → "Agregar a pantalla principal" o "Instalar app"');
          return;
        }

        alert('Usa el menú del navegador para agregar a pantalla principal.');
      };

      if (btnInstall) btnInstall.onclick = installAction;
      if (bannerInstallBtn) bannerInstallBtn.onclick = installAction;
      if (close) close.onclick = hideInstallBanner_;

      if (isIOS_() && !isStandalone_()) showInstallBanner_();
    }

    // ========= PDF =========
    function loadScriptOnce_(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error("No se pudo cargar: " + src));
        document.head.appendChild(s);
      });
    }

    async function downloadPdfFromPassCard_() {
      const btn = $("btnPdf");
      const card = $("passCard");
      const actionsBar = $("actionsBar");

      try {
        clearError();
        if (btn) { btn.disabled = true; btn.textContent = "Generando…"; }
        if (!card) throw new Error("No se encontró #passCard.");

        await loadScriptOnce_("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
        await loadScriptOnce_("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");

        const jsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDF) throw new Error("jsPDF no disponible (window.jspdf.jsPDF).");
        if (typeof html2canvas === "undefined") throw new Error("html2canvas no disponible.");

        if (actionsBar) actionsBar.classList.add("pdf-hide");

        const prevBg = card.style.backgroundColor;
        const prevColor = card.style.color;
        card.style.backgroundColor = "#111827";
        card.style.color = "#e5e7eb";

        let canvas;
        try {
          canvas = await html2canvas(card, { scale: 3, backgroundColor: "#111827" });
        } finally {
          card.style.backgroundColor = prevBg;
          card.style.color = prevColor;
          if (actionsBar) actionsBar.classList.remove("pdf-hide");
        }

        const imgData = canvas.toDataURL("image/png");

        const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        const maxW = pageW * 0.92;
        const maxH = pageH * 0.85;

        const ratio = canvas.width / canvas.height;

        let drawH = maxH;
        let drawW = ratio * drawH;

        if (drawW > maxW) {
          drawW = maxW;
          drawH = drawW / ratio;
        }

        const x = (pageW - drawW) / 2;
        const y = (pageH - drawH) / 2;

        pdf.addImage(imgData, "PNG", x, y, drawW, drawH);

        const blob = pdf.output("blob");
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pase.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);

      } catch (err) {
        console.error(err);
        showError("PDF ERROR: " + (err?.message || String(err)));
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = "Descargar PDF"; }
      }
    }

    function wirePdfButton_() {
      const btnPdf = $("btnPdf");
      if (!btnPdf) return;
      btnPdf.onclick = () => downloadPdfFromPassCard_();
    }

    // ========= Load Ticket =========
    async function loadTicket(token) {
      clearError();
      const subtitle = $("subtitle");
      if (subtitle) subtitle.textContent = "Buscando pase…";

      let res;
      try {
        res = await fetch(`${API_BASE_URL}?action=ticket&token=${encodeURIComponent(token)}`);
      } catch {
        showError("No se pudo conectar al servidor.");
        if (subtitle) subtitle.textContent = "Error";
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch {
        showError("Respuesta inválida del servidor.");
        if (subtitle) subtitle.textContent = "Error";
        return;
      }

      if (!data.ok) {
        showError("Pase no encontrado.");
        if (subtitle) subtitle.textContent = "No encontrado";
        return;
      }

      // Guardar token como "último pase"
      localStorage.setItem(LS_LAST_TOKEN_KEY, token);

      const t = data.ticket;

      // Mostrar ticket + acciones
      $("passCard").style.display = "block";
      $("actionsBar").style.display = "grid";
      if (subtitle) subtitle.textContent = "Pase cargado";

      // ✅ Nuevo contrato
      setStatusBadge(t.estatus);
      $("nombre").textContent = t.nombre || "-";
      $("asiento").textContent = t.asiento || "-";
      $("nombreEvento").textContent = t.evento || "-";
      $("lugarDescripcion").textContent = t.lugar || "-";
      $("hora").textContent = t.fecha +" - " + t.hora +" hr";


      console.log("ticket recibido:", t);
      console.log("fecha:", t.fecha, "hora:", t.hora);


      // ✅ QR siempre apunta al pase (URL canónica)
      const link = `${location.origin}/pases/pase.html?token=${encodeURIComponent(token)}`;
      setQr(link);
    }

    // ========= INIT =========
    wireInstallUI_();
    wirePdfButton_();

    const token = getTokenFromQuery();
    if (!token) {
      showError("Falta token. Regresa y pega tu token.");
      const subtitle = $("subtitle");
      if (subtitle) subtitle.textContent = "Falta token";
    } else {
      loadTicket(token);
    }
  </script>
</body>
</html>
